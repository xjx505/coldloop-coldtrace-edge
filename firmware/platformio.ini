[platformio]
default_envs = hardware

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.15
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:hardware]
build_flags =
  ${env.build_flags}
  -DCOLDLOOP_SIM=0

[env:wokwi]
build_flags =
  ${env.build_flags}
  -DCOLDLOOP_SIM=1
